name: CI — audit-service

on:
  push:
    paths: ['services/psp-switch/audit-service/**']
  pull_request:
    paths: ['services/psp-switch/audit-service/**']

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/psp-switch/audit-service

    services:
      postgres:
        image: postgres:16-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_DB: audit_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Checkstyle
        run: mvn checkstyle:check -q || true

      - name: PMD
        run: mvn pmd:check -q || true

      - name: SpotBugs
        run: mvn spotbugs:check -q || true

      - name: Unit tests
        run: mvn test -Dspring.profiles.active=test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/audit_test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-audit
          path: services/psp-switch/audit-service/target/surefire-reports/
