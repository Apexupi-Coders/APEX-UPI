name: CI — npci-adapter

on:
  push:
    paths: ['services/psp-switch/npci-adapter/**']
  pull_request:
    paths: ['services/psp-switch/npci-adapter/**']

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/psp-switch/npci-adapter

    services:
      kafka:
        image: confluentinc/cp-kafka:7.6.0
        ports: ['9092:9092']
        env:
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Checkstyle
        run: mvn checkstyle:check -q || true

      - name: PMD
        run: mvn pmd:check -q || true

      - name: SpotBugs
        run: mvn spotbugs:check -q || true

      - name: Unit tests
        run: mvn test -Dspring.profiles.active=test
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-npci-adapter
          path: services/psp-switch/npci-adapter/target/surefire-reports/
