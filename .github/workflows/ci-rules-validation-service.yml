name: CI — rules-validation-service

on:
  push:
    paths: ['services/psp-switch/rules-validation-service/**']
  pull_request:
    paths: ['services/psp-switch/rules-validation-service/**']

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/psp-switch/rules-validation-service

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Checkstyle
        run: mvn checkstyle:check -q || true

      - name: PMD
        run: mvn pmd:check -q || true

      - name: SpotBugs
        run: mvn spotbugs:check -q || true

      - name: Unit tests
        run: mvn test -Dspring.profiles.active=test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-rules-validation
          path: services/psp-switch/rules-validation-service/target/surefire-reports/
