name: CI — banking-switch-orchestrator

on:
  push:
    paths:
      - 'services/banking-switch/orchestrator/**'
      - '.github/workflows/ci-banking-switch-orchestrator.yml'
  pull_request:
    paths:
      - 'services/banking-switch/orchestrator/**'
      - '.github/workflows/ci-banking-switch-orchestrator.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/banking-switch/orchestrator

    services:
      kafka:
        image: confluentinc/cp-kafka:7.6.0
        ports: ['9092:9092']
        env:
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      postgres:
        image: postgres:16-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_DB: bankswitch_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Checkstyle
        run: mvn checkstyle:check -q || true

      - name: PMD
        run: mvn pmd:check -q || true

      - name: SpotBugs
        run: mvn spotbugs:check -q || true

      - name: Install parent POM
        working-directory: .
        run: |
          cat > /tmp/parent-pom.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.bankingswitch</groupId>
            <artifactId>payment-switch</artifactId>
            <version>1.0.0-SNAPSHOT</version>
            <packaging>pom</packaging>
          </project>
          EOF
          mvn install:install-file \
            -Dfile=/tmp/parent-pom.xml \
            -DgroupId=com.bankingswitch \
            -DartifactId=payment-switch \
            -Dversion=1.0.0-SNAPSHOT \
            -Dpackaging=pom \
            -DgeneratePom=false

      - name: Build & verify
        run: mvn verify -DskipTests -q

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-banking-orchestrator
          path: services/banking-switch/orchestrator/target/surefire-reports/
